.hs.h-si { background: #E6F1FB; color: #185FA5; }

.hall-col { position: relative; border-right: 1px solid #f0f0f0; }
.hall-col:last-child { border-right: none; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid #f0f0f0; pointer-events: none; }
.hline.bold { border-top-color: #e0e0e0; }
.cls { position: absolute; left: 2px; right: 2px; border-radius: 4px; padding: 3px 4px; font-size: 11px; line-height: 1.3; overflow: hidden; cursor: pointer; }
.cls:hover { filter: brightness(0.93); }
.cls .ctime { font-size: 10px; opacity: 0.65; }
.cls .cname { font-weight: 600; font-size: 11px; }
.cls .tname { font-size: 11px; font-weight: 500; opacity: 0.9; }
.cls .onl { display: inline-block; font-size: 9px; font-weight: 600; padding: 0 4px; border-radius: 6px; background: rgba(255,255,255,0.7); color: #185FA5; margin-left: 3px; vertical-align: 1px; }

const used = new Set();        // направления без цвета из 1С (запасная палитра TYPES)
const usedCol = new Map();     // цвет из 1С → названия классов этого цвета
const shortName = s => s.replace(/\.?\s*Все уровни\.?/i, '').replace(/^(Хатха|Аштанга) йога/i, '$1')
  .replace(/НАЧИНАЮЩИЙ/, 'Начинающий').replace(/^Хатха и /, 'Хатха + ').replace(/\.$/, '');
// Тёмный текст на светлом фоне, белый — на тёмном
const textOn = rgb => {
  const [r, g, b] = (rgb.match(/\d+/g) || [255, 255, 255]).map(Number);
  return (0.299 * r + 0.587 * g + 0.114 * b) < 150 ? '#fff' : '#1a1a1a';
};
days.forEach(day => {
  const data = sched[day] || {};
  const block = document.createElement('div');
  block.className = 'day-block';
  block.innerHTML = `<div class="day-header">${day}</div><div class="hall-strip">` +
    Object.values(HALLS).map(([l, , cls]) => `<div class="hs ${cls}">${l}</div>`).join('') + '</div>';

  const cols = document.createElement('div');
  cols.className = 'cols';
  Object.keys(HALLS).forEach(key => {
    const col = document.createElement('div');
    col.className = 'hall-col';
    for (let h = START_H; h <= END_H; h++) {
      const l = document.createElement('div');
      l.className = 'hline' + (h % 2 === 0 ? ' bold' : '');
      l.style.top = ((h - START_H) / (END_H - START_H) * H) + 'px';
      col.appendChild(l);
    }
    (data[key] || []).forEach(item => {
      const endMin = toMin(item.t) + item.d;
      const endStr = (Math.floor(endMin / 60) + START_H) + ':' + String(endMin % 60).padStart(2, '0');
      const div = document.createElement('div');
      const title = item.reserve ? 'Тичерз' : (item.c || 'НУЖЕН ПРЕПОДАВАТЕЛЬ');
      // В блоке — короткое название, полное — во всплывающей карточке
      const short = shortName(title);
      let cls;
      if (item.reserve) cls = 'cls-res';
      else if (item.need && !item.c) cls = 'cls-need';
      else if (item.col) {
        // цвет класса как в расписании 1С
        cls = item.need ? 'cls-need' : '';
        if (!item.need) { div.style.background = item.col; div.style.color = textOn(item.col); }
        if (!usedCol.has(item.col)) usedCol.set(item.col, new Set());
        usedCol.get(item.col).add(short);
      }
      else { cls = typeOf(item.c) + (item.need ? ' cls-need' : ''); used.add(typeOf(item.c)); }
      div.className = 'cls ' + cls;
      div.style.top = (toY(item.t) + 1) + 'px';
      div.style.height = (toHpx(item.d) - 2) + 'px';
      const who = item.reserve || (item.need && !item.c) ? '' : (item.need ? 'НУЖЕН ПРЕПОДАВАТЕЛЬ' : item.n);
      div.innerHTML = `<div class="ctime">${item.t}–${endStr}${item.online ? '<span class="onl">+онлайн</span>' : ''}</div>` +
        `<div class="cname">${esc(short)}</div><div class="tname">${esc(who || '')}</div>`;
      div.addEventListener('click', e => {
        e.stopPropagation();
        const popup = document.getElementById('popup');
        document.getElementById('popup-time').textContent = item.t + '–' + endStr + ' · ' + item.d + ' мин';
        document.getElementById('popup-class').textContent = item.reserve ? 'Тичерз (каждую субботу)' : title;
        document.getElementById('popup-teacher').textContent = item.need && item.c ? 'Нужен преподаватель (сейчас: ' + item.n + ')' : (who || '');
        const hallEl = document.getElementById('popup-hall');
        hallEl.textContent = HALLS[key][1];
        hallEl.className = 'popup-hall ' + HALLS[key][2];
        document.getElementById('popup-day').textContent = day;
        document.getElementById('popup-onl').style.display = item.online ? 'block' : 'none';
        const rect = div.getBoundingClientRect();
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        const scrollX = window.scrollX || document.documentElement.scrollLeft;
        popup.style.top = (rect.bottom + scrollY + 6) + 'px';
        let left = rect.left + scrollX;
        if (left + 310 > document.documentElement.clientWidth) left = Math.max(4, rect.right + scrollX - 310);
        popup.style.left = left + 'px';
        popup.classList.add('open');
      });
      col.appendChild(div);
    });
    cols.appendChild(col);
  });
  block.appendChild(cols);
  wrap.appendChild(block);
});

// Легенда — только направления, которые есть в сетке
const legend = document.getElementById('legend');
const dot = (style, label) => `<div class="leg-item"><div class="leg-dot" style="${style}"></div>${label}</div>`;
legend.innerHTML = [...usedCol].map(([c, names]) => dot('background:' + c, [...names].join(' / '))).join('') +
  TYPES.filter(([cls]) => used.has(cls)).map(([cls, label]) => {
  const probe = document.createElement('div'); probe.className = cls; document.body.appendChild(probe);
  const bg = getComputedStyle(probe).backgroundColor; probe.remove();
  return dot('background:' + bg, label);
}).join('') +
  dot('background:#E5383B;border:1px solid #A4161A', 'Нужен преподаватель') +
  dot('background:#E2E2E2;border:1px dashed #aaa', 'Тичерз') +
  `<div class="leg-item"><span class="onl" style="font-size:10px;font-weight:600;color:#185FA5;background:#E6F1FB;padding:0 5px;border-radius:6px;">+онлайн</span>идёт и в Zoom</div>`;

document.getElementById('popup-close').addEventListener('click', () => document.getElementById('popup').classList.remove('open'));
document.addEventListener('click', e => { const p = document.getElementById('popup'); if (!p.contains(e.target)) p.classList.remove('open'); });
</script>
</body>
</html>
